; ESP32 + 16x16 WS2812B panel, frames over USB serial.
; Build with PlatformIO: pio run -t upload
; Or open src/main.cpp in Arduino IDE, install FastLED, and paste it into a sketch.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    fastled/FastLED@^3.7.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
